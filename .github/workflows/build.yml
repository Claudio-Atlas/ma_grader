name: Build installers

# Builds the MA Grader desktop app for BOTH Windows and macOS in the cloud,
# then attaches the .exe and .dmg to a GitHub Release.
#
# How to cut a release:
#   1. Push a version tag, e.g.   git tag v0.1.1 && git push origin v0.1.1
#   2. Watch the "Actions" tab — two jobs run (Windows + macOS).
#   3. When they finish, the installers appear on the "Releases" page.
#
# You can also run it by hand from the Actions tab ("Run workflow"); in that
# mode the installers are uploaded as downloadable build artifacts instead of a
# release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create/update the Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_flag: "--win"
          - os: macos-latest
            eb_flag: "--mac"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Freeze the engine (PyInstaller)
        run: pyinstaller --noconfirm --distpath desktop/engine --workpath desktop/build/pyi engine.spec

      - name: Install Node deps
        working-directory: desktop
        run: npm install

      - name: Build the UI
        working-directory: desktop
        run: npm run build:ui

      - name: Package the app (electron-builder)
        working-directory: desktop
        run: npx electron-builder ${{ matrix.eb_flag }} --publish never

      # When triggered manually, keep the installers as build artifacts.
      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ma-grader-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg

      # When triggered by a version tag, publish to a GitHub Release.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
          fail_on_unmatched_files: false
